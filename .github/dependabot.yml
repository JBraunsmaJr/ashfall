version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
      brutal:
        patterns: ["Ahwoo.Brutal.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
