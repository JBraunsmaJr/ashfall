name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Ashfall.slnx

      - name: Build
        run: dotnet build Ashfall.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Ashfall.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Proving-ground run (twice, must match)
        run: >
          dotnet run --project src/Ashfall.Headless -c Release --no-build --
          --repeat 2
          --hash-out proving-ground-${{ runner.os }}.hash
          --checkpoints-out proving-ground-${{ runner.os }}.checkpoints

      - name: Upload proving-ground hashes
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ runner.os }}
          path: proving-ground-${{ runner.os }}.*

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: TestResults

  render-smoke:
    # Runs the real client: window, Vulkan device, swapchain and 300 cleared frames, on Mesa's software
    # Vulkan driver (lavapipe) under a virtual X display, with the Khronos validation layer turned on.
    # libvulkan-dev is deliberately not installed, as on players' machines (see NativeLibraryFallbacks).
    name: Render smoke test (Linux, software Vulkan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install software Vulkan, validation layer and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb

      - name: Build client
        run: dotnet build src/Ashfall.Client -c Release

      - name: Render 300 frames with validation
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            dotnet run --project src/Ashfall.Client -c Release --no-build -- --frames 300 --validation 2>&1 | tee render.log
          if grep -q "Validation Error" render.log; then
            echo "::error::Vulkan validation reported errors (see render.log above)."
            exit 1
          fi
          grep -q "Presented 300 frames" render.log

  cross-platform-determinism:
    # M0 exit gate: the same replay must produce the same hash on Windows and Linux.
    name: Cross-platform determinism
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          merge-multiple: true

      - name: Compare Linux and Windows hashes
        run: |
          echo "## Proving-ground state hashes" >> "$GITHUB_STEP_SUMMARY"
          echo "Linux:   $(cat proving-ground-Linux.hash)" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows: $(cat proving-ground-Windows.hash)" >> "$GITHUB_STEP_SUMMARY"
          if diff proving-ground-Linux.checkpoints proving-ground-Windows.checkpoints > checkpoint.diff; then
            echo "Identical at every 30-tick checkpoint." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Linux and Windows simulations diverged. First difference:"
            head -n 4 checkpoint.diff
            exit 1
          fi
          diff proving-ground-Linux.hash proving-ground-Windows.hash
