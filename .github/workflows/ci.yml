name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Ashfall.slnx

      - name: Build
        run: dotnet build Ashfall.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Ashfall.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Proving-ground run (twice, must match)
        run: >
          dotnet run --project src/Ashfall.Headless -c Release --no-build --
          --repeat 2
          --hash-out proving-ground-${{ runner.os }}.hash
          --checkpoints-out proving-ground-${{ runner.os }}.checkpoints

      - name: Skirmish to victory (twice, must match)
        run: >
          dotnet run --project src/Ashfall.Headless -c Release --no-build --
          --mode skirmish
          --repeat 2
          --hash-out skirmish-${{ runner.os }}.hash
          --checkpoints-out skirmish-${{ runner.os }}.checkpoints

      - name: Skirmish on a generated map (2v2 Crossroads, twice, must match)
        run: >
          dotnet run --project src/Ashfall.Headless -c Release --no-build --
          --mode skirmish --players 4 --teams 0,1,0,1
          --archetype crossroads --map-seed 7 --slider elevation=60
          --repeat 2
          --hash-out generated-${{ runner.os }}.hash
          --checkpoints-out generated-${{ runner.os }}.checkpoints

      - name: Horde stress (M5 gate) - 5,000 creatures twice, must match, mean tick within 25 ms
        run: >
          dotnet run --project src/Ashfall.Headless -c Release --no-build --
          --mode swarm --creatures 5000
          --repeat 2 --tick-budget-ms 25
          --hash-out swarm-${{ runner.os }}.hash
          --checkpoints-out swarm-${{ runner.os }}.checkpoints

      - name: Nest-fed horde (M5) - eight Spawning Pits for six minutes, twice, must match, within budget
        run: >
          dotnet run --project src/Ashfall.Headless -c Release --no-build --
          --mode swarm --nests 8 --ticks 5400
          --repeat 2 --tick-budget-ms 25
          --hash-out nests-${{ runner.os }}.hash
          --checkpoints-out nests-${{ runner.os }}.checkpoints

      - name: Co-op Purge - two scripted allies against the Maw's nests on Recruit, played to a result, twice, must match
        run: >
          dotnet run --project src/Ashfall.Headless -c Release --no-build --
          --mode purge --players 2 --seed 1 --difficulty recruit
          --repeat 2
          --hash-out purge-${{ runner.os }}.hash
          --checkpoints-out purge-${{ runner.os }}.checkpoints

      - name: Map generation gate (M4) - slider sweeps on every archetype, all valid and fair
        run: >
          dotnet run --project tools/Ashfall.Tools.MapPreview -c Release --no-build --
          --seeds 40 --sweep --min-first-try 90 --verbose
          --sheet mapgen-${{ runner.os }}.png

      - name: LAN match (M3 gate) - four separate processes over UDP, no desyncs, replay verified
        shell: bash
        run: |
          LAN_MATCH_OUT=lan-match eng/lan-match.sh 4 47600 Release
          cp lan-match/peer0.hash lan-${{ runner.os }}.hash

      - name: Upload determinism hashes
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ runner.os }}
          path: |
            proving-ground-${{ runner.os }}.*
            skirmish-${{ runner.os }}.*
            generated-${{ runner.os }}.*
            swarm-${{ runner.os }}.*
            nests-${{ runner.os }}.*
            purge-${{ runner.os }}.*
            lan-${{ runner.os }}.hash

      - name: Upload map generation contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: mapgen-${{ runner.os }}
          path: mapgen-${{ runner.os }}.png

      - name: Upload LAN match logs and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lan-match-${{ runner.os }}
          path: lan-match/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: TestResults

  render-smoke:
    # Runs the real client: window, Vulkan device, swapchain and the full M2 scene (terrain, units, fog,
    # lights, sidebar) on Mesa's software Vulkan driver (lavapipe) under a virtual X display, with the
    # Khronos validation layer turned on. Frames are captured as PNG artifacts for a visual check.
    # libvulkan-dev is deliberately not installed, as on players' machines (see NativeLibraryFallbacks).
    name: Render smoke test (Linux, software Vulkan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install software Vulkan, validation layer and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb

      - name: Build client
        run: dotnet build src/Ashfall.Client -c Release

      - name: Render 300 frames of a skirmish with validation
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            dotnet run --project src/Ashfall.Client -c Release --no-build -- \
              --frames 300 --validation --screenshot render-start.png 2>&1 | tee render.log
          if grep -q "Validation Error" render.log; then
            echo "::error::Vulkan validation reported errors (see render.log above)."
            exit 1
          fi
          grep -q "Presented 300 frames" render.log

      - name: Render the main menu with validation
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            dotnet run --project src/Ashfall.Client -c Release --no-build -- \
              --menu --frames 60 --validation --screenshot render-menu.png 2>&1 | tee menu.log
          if grep -q "Validation Error" menu.log; then
            echo "::error::Vulkan validation reported errors (see menu.log above)."
            exit 1
          fi
          test -s render-menu.png

      - name: Render a battle (autopilot, six game minutes) with validation
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            dotnet run --project src/Ashfall.Client -c Release --no-build -- \
              --autopilot --speed unthrottled --until-tick 5450 --look-at 18,18 --zoom 2 \
              --validation --screenshot render-battle.png 2>&1 | tee battle.log
          if grep -q "Validation Error" battle.log; then
            echo "::error::Vulkan validation reported errors (see battle.log above)."
            exit 1
          fi
          grep -q "simulation at tick 54" battle.log

      - name: Render a Purge (autopilot with an AI ally, through the first wave) with validation
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            dotnet run --project src/Ashfall.Client -c Release --no-build -- \
              --purge --allies 1 --seed 1 --autopilot --speed unthrottled --until-tick 4700 --zoom 1 \
              --validation --screenshot render-purge.png 2>&1 | tee purge.log
          if grep -q "Validation Error" purge.log; then
            echo "::error::Vulkan validation reported errors (see purge.log above)."
            exit 1
          fi
          grep -q "simulation at tick 47" purge.log

      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-smoke-frames
          path: render-*.png

  cross-platform-determinism:
    # M0/M1/M4/M5 exit gates: the same matches (hand-made and generated maps, the swarm, the Purge) must produce the same
    # hashes on Windows and Linux.
    name: Cross-platform determinism
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          merge-multiple: true

      - name: Compare Linux and Windows hashes
        run: |
          status=0
          for replay in proving-ground skirmish generated swarm nests purge; do
            echo "## ${replay} state hashes" >> "$GITHUB_STEP_SUMMARY"
            echo "Linux:   $(cat ${replay}-Linux.hash)" >> "$GITHUB_STEP_SUMMARY"
            echo "Windows: $(cat ${replay}-Windows.hash)" >> "$GITHUB_STEP_SUMMARY"
            if diff ${replay}-Linux.checkpoints ${replay}-Windows.checkpoints > ${replay}.diff \
              && diff ${replay}-Linux.hash ${replay}-Windows.hash > /dev/null; then
              echo "Identical at every 30-tick checkpoint." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::${replay}: Linux and Windows simulations diverged. First difference:"
              head -n 4 ${replay}.diff
              status=1
            fi
          done
          echo "## LAN match (4 processes) final state" >> "$GITHUB_STEP_SUMMARY"
          echo "Linux:   $(cat lan-Linux.hash)" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows: $(cat lan-Windows.hash)" >> "$GITHUB_STEP_SUMMARY"
          if ! diff lan-Linux.hash lan-Windows.hash > /dev/null; then
            echo "::error::The LAN match ended differently on Linux and Windows."
            status=1
          fi
          exit $status
